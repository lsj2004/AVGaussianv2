[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avgaussianv2"
version = "0.1.0"
description = "RGBD-conditioned fusion of independent visual and acoustic Gaussian fields"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "soundfile>=0.12",
  "torch>=2.5,<2.6",
]

[project.optional-dependencies]
upstream = [
  "yacs>=0.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin Ruff's historical default checks so tool upgrades cannot silently widen
# the repository gate to every preview/plugin rule.
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["avgaussianv2"]
