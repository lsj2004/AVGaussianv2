schema: avgaussianv2.lre-loss-ablation
version: 1
objective: >
  Test whether a sign-sensitive left/right energy-ratio loss reduces held-out
  LRE without materially degrading the native AudioGS reconstruction metrics.
execution_policy:
  mode: priority_driven_dynamic_pruning
  candidate_matrix_is_upper_bound: true
  gpu_count_expected: 2
  gpu_memory_gb: 48
  initial_processes_per_gpu: 2
  max_processes_per_gpu: 4
  multi_seed_priority: last

scenes: [scene1_opera, Scene7playing]

fixed_loss:
  lre_scale_db: 6.0
  lre_epsilon: 1.0e-8
  lre_smooth_l1_beta: 1.0
  formula: smooth_l1(pred_lre_db / scale_db, target_lre_db / scale_db)

architecture_screening:
  seed: 42
  lambda_lre: 0.0
  required:
    - audio_only
    - plain_unet
    - joint_conditioned
    - cross_attention_masks
    - query_dependent_p1
  conditional:
    - cross_attention
  default_pruned:
    - direct_conditioned_unet
    - gated_native_residual
  branch_sources:
    audio_only: clean/codebase-structure
    joint_conditioned: clean/codebase-structure
    cross_attention: clean/codebase-structure
    plain_unet: clean/codebase-structure
    cross_attention_masks: clean/codebase-structure
    query_dependent_p1: clean/codebase-structure
  keep_architectures_max: 2
  require_visual_causal_check_for_conditioned: true

architecture_configs:
  audio_only:
    training_mode: audio_only
    scene1_opera: ../benchmark_cam38/scene1_opera.yaml
    Scene7playing: ../benchmark_cam38/Scene7playing.yaml
  joint_conditioned:
    training_mode: joint_conditioned
    scene1_opera: ../benchmark_cam38/scene1_opera.yaml
    Scene7playing: ../benchmark_cam38/Scene7playing.yaml
  plain_unet:
    training_mode: audio_only
    scene1_opera: ../benchmark_cam38/scene1_opera_plain_unet.yaml
    Scene7playing: ../benchmark_cam38/Scene7playing_plain_unet.yaml
  cross_attention:
    training_mode: joint_conditioned
    scene1_opera: ../benchmark_cam38/scene1_opera_cross_attention.yaml
    Scene7playing: ../benchmark_cam38/Scene7playing_cross_attention.yaml
  cross_attention_masks:
    training_mode: joint_conditioned
    scene1_opera: ../benchmark_cam38/scene1_opera_cross_attention_masks.yaml
    Scene7playing: ../benchmark_cam38/Scene7playing_cross_attention_masks.yaml
  query_dependent_p1:
    training_mode: joint_conditioned
    scene1_opera: ../benchmark_cam38/scene1_opera_query_dependent_p1.yaml
    Scene7playing: ../benchmark_cam38/Scene7playing_query_dependent_p1.yaml

loss_search_systems:
  source: architecture_screening_survivors

reference_baselines:
  - source_binaural
  - mono
reference_metrics:
  - paper_mag
  - paper_env
  - paper_lre_db
  - paper_dpam

screening:
  seeds: [42]
  lambda_lre: [0.0, 0.01, 0.02, 0.05]
  report_steps: [5000]
  keep_nonzero_candidates_max: 2
  selection:
    unit: scene_system
    candidates_must_be_nonzero: true
    rank:
      - nonfinite_samples_ascending
      - guardrail_violations_ascending
      - worst_guardrail_overrun_ascending
      - macro_lre_error_db_ascending
      - lambda_lre_ascending
    fallback: >
      Select at most two nonzero candidates. Select fewer, or none, when the
      remaining candidates fail the guardrails or are dominated.
  gates:
    both_scenes_required: true
    all_systems_required: true
    lre_relative_improvement_min: 0.15
    audio_total_relative_degradation_max: 0.03
    waveform_l1_relative_degradation_max: 0.03
    nonfinite_samples_max: 0

confirmation:
  seeds: [42]
  lambda_lre:
    source: screening_winners_plus_zero
  report_steps: [5000, 10000, 30000]
  primary_step: 30000
  gates:
    both_scenes_required: true
    all_systems_required: true
    lre_relative_improvement_min: 0.10
    audio_total_relative_degradation_max: 0.03
    waveform_l1_relative_degradation_max: 0.03
    lre_paired_win_rate_min: 0.55
    bootstrap_confidence: 0.95
    bootstrap_resamples: 10000
    nonfinite_samples_max: 0

robustness:
  priority: last
  seeds: [17, 73]
  lambda_lre:
    source: final_survivor_plus_zero
  report_steps: [30000]

reporting:
  primary_metric: lre_error_db
  pairing_keys: [scene, system, seed, step, sample_id]
  paper_comparison_metrics:
    protocol: audiogs_paper_v1
    required_for_models_and_references: true
    dpam_may_be_skipped_during_smoke_only: true
  guardrail_metrics:
    - audio_total
    - audio_mono
    - audio_diff
    - waveform_l1
    - mono_lsd
    - diff_lsd
    - rgb_l1
    - rgb_psnr
    - rgb_ssim
  required_aggregations:
    - per_sample
    - per_scene
    - macro
    - sample_weighted_micro
    - per_seed
    - across_seed_mean_std
    - paired_delta
    - paired_win_rate
    - bootstrap_confidence_interval
  bootstrap:
    method: paired_hierarchical_scene_seed_sample
    seed: 20260731
    confidence: 0.95
    resamples: 10000
  expected_counts:
    reference_baseline_rows: 846
    screening_training_runs_max: 16
    confirmation_training_runs_max: 12
    robustness_training_runs_max: 8
    screening_per_sample_rows_max: 3384
    confirmation_per_sample_rows_max: 7614
    robustness_per_sample_rows_max: 1692

output:
  generated_configs: ../../configs/generated/lre_loss_ablation
  run_root: ../../runs/lre_loss_ablation_visual_time_v2
  result_root: ../../results/lre_loss_ablation_visual_time_v2
